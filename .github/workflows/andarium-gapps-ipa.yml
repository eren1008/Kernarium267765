# SPDX-License-Identifier: GPL-2.0-or-later
# Adds MindTheGapps (Android 17, arm64) to the Android system inside an
# Andarium IPA (by default the original one of upstream's 1.0b15-release) and
# publishes the result as a DRAFT release of this repository. A draft is visible
# only to the repository's owner, so the Google apps in it are not redistributed
# publicly.
name: Andarium IPA with GApps

on:
  workflow_dispatch:
  push:
    branches: [gapps]

permissions:
  contents: write
  actions: read

env:
  # A run whose andarium-system-gapps artifact to reuse; empty to rebuild it.
  REUSE_RUN: ""
  # The IPA to add GApps to: a release of a repository, and an asset pattern.
  BASE_REPO: imxieyi/Kernarium
  BASE_RELEASE: 1.0b15-release
  BASE_PATTERN: "*.ipa"
  OUT_RELEASE: andarium-gapps
  OUT_IPA: Andarium-GApps.ipa
  OUT_TITLE: Andarium 1.0 (15) with Google apps

concurrency:
  group: andarium-gapps-ipa
  cancel-in-progress: true

jobs:
  system:
    name: Add GApps to the system disk
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GAPPS_REPO: MindTheGapps/17.0.0-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build erofs-utils
        if: env.REUSE_RUN == ''
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf automake libtool pkg-config uuid-dev zlib1g-dev liblz4-dev libzstd-dev unzip
          for url in https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git https://github.com/erofs/erofs-utils.git; do
            tags=$(git ls-remote --tags --refs "$url" | sed 's#.*refs/tags/##') || continue
            tag=$(echo "$tags" | grep -E '^v1\.8(\.[0-9]+)?$' | sort -V | tail -1)
            [ -n "$tag" ] || tag=$(echo "$tags" | grep -E '^v1\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
            git clone -q --depth 1 --branch "$tag" "$url" /tmp/erofs-utils && break
          done
          cd /tmp/erofs-utils
          git log -1 --format='erofs-utils %H %s'
          ./autogen.sh
          ./configure --enable-lz4 --with-libzstd --enable-multithreading --disable-fuse
          make -j"$(nproc)"
          sudo make install
          mkfs.erofs -V || true
          mkfs.erofs --help 2>&1 | grep -iE 'zstd|level|workers|-C' || true
          fsck.erofs --help 2>&1 | grep -iE 'extract|xattr|preserve' || true

      - name: Download the Andarium IPA and MindTheGapps
        if: env.REUSE_RUN == ''
        run: |
          set -eux
          mkdir -p dl
          gh release view "$BASE_RELEASE" -R "$BASE_REPO" --json tagName,name,publishedAt,assets \
            --jq '.tagName, .name, .publishedAt, (.assets[] | "\(.name) \(.size)")'
          gh release download "$BASE_RELEASE" -R "$BASE_REPO" -p "$BASE_PATTERN" -D dl
          ipa=$(ls dl/*.ipa | head -1)
          unzip -p "$ipa" 'Payload/*.app/Info.plist' > Info.plist
          python3 -c "import plistlib; p = plistlib.load(open('Info.plist', 'rb')); print({k: p.get(k) for k in ('CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion', 'MinimumOSVersion')})"
          gh release view -R "$GAPPS_REPO" --json tagName,publishedAt,assets \
            --jq '.tagName, .publishedAt, (.assets[] | "\(.name) \(.size)")'
          gh release download -R "$GAPPS_REPO" -p 'MindTheGapps-*.zip' -D dl
          ls -la dl
          unzip -q "$ipa" 'Payload/*.app/andarium-system/*' -d base
          find base -maxdepth 6 | head -20
          rm "$ipa"
          df -h /

      - name: Add GApps
        if: env.REUSE_RUN == ''
        run: |
          set -eux
          system=$(dirname "$(find base -path '*/andarium-system/release-manifest.json' | head -1)")
          gapps=$(ls dl/MindTheGapps-*.zip | sort | tail -1)
          sudo python3 -I .github/gapps/add_gapps.py \
            --system "$system" --gapps "$gapps" \
            --policy android/lineage-24/support/image/disk-policy.json \
            --disk-tool android/lineage-24/tools/ubd-disk.py \
            --work "$RUNNER_TEMP/gapps-work" --output out/andarium-system
          sudo rm -rf "$RUNNER_TEMP/gapps-work"
          sudo chown -R "$(id -u):$(id -g)" out
          ls -laR out

      - uses: actions/upload-artifact@v4
        if: env.REUSE_RUN == ''
        with:
          name: andarium-system-gapps
          path: out/andarium-system/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  ipa:
    name: Package and sign the IPA
    needs: system
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Andarium/Config

      - uses: actions/download-artifact@v4
        if: env.REUSE_RUN == ''
        with:
          name: andarium-system-gapps
          path: gapps

      - uses: actions/download-artifact@v4
        if: env.REUSE_RUN != ''
        with:
          name: andarium-system-gapps
          path: gapps
          run-id: ${{ env.REUSE_RUN }}
          github-token: ${{ github.token }}

      - name: Put the new system into the IPA and sign it ad hoc
        run: |
          set -eux
          gh release download "$BASE_RELEASE" -R "$BASE_REPO" -p "$BASE_PATTERN" -D dl
          base=$(ls "$PWD"/dl/*.ipa | head -1)
          mkdir ipa
          (cd ipa && unzip -q "$base")
          rm "$base"
          app=$(ls -d ipa/Payload/*.app)
          plutil -p "$app/Info.plist" | grep -E 'MinimumOSVersion|CFBundleShortVersionString|CFBundleVersion|CFBundleIdentifier'
          system="$app/andarium-system"
          for file in guest/system.img guest/partition-layout.json release-manifest.json; do
            test -f "$system/$file"
            test -f "gapps/$file"
            cp "gapps/$file" "$system/$file"
          done
          ls -la "$system" "$system/guest"
          # Ad hoc signatures that keep the base IPA's own entitlements (extended
          # virtual addressing, increased memory limit), so sideloading keeps them.
          codesign -d --entitlements - --xml "$app" > entitlements.plist 2>/dev/null || true
          if ! grep -q '<key>' entitlements.plist; then
            cp Andarium/Config/Andarium.entitlements entitlements.plist
          fi
          cat entitlements.plist
          for framework in "$app"/Frameworks/*.framework; do codesign -f -s - "$framework"; done
          codesign -f -s - --entitlements entitlements.plist "$app"
          codesign -d --entitlements - "$app"
          codesign --verify --strict --verbose=2 "$app" || echo "::warning::codesign --verify failed"
          (cd ipa && zip -qry "../$OUT_IPA" Payload)
          shasum -a 256 "$OUT_IPA" | tee "$OUT_IPA.sha256"
          ls -lh "$OUT_IPA"

      - name: Publish the draft release
        run: |
          set -eux
          gh release create "$OUT_RELEASE" -R "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" \
            --title "$OUT_TITLE" \
            --notes "The $BASE_RELEASE IPA of $BASE_REPO with MindTheGapps 17 (slim set, no Android Switch) added to the Android product and system_ext partitions. Delete the old Andarium app (or erase its virtual machine) before using this one. Built from commit ${GITHUB_SHA}." \
            "$OUT_IPA" "$OUT_IPA.sha256"
